<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <svg width="100" height="100">
        <circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="yellow"/>
    </svg>

    <svg width="400" height="100">
        <rect width="400" height="100" style="fill: rgb(0, 0, 255); stroke-width: 10; stroke: rgb(0, 0, 0);" />
    </svg>

    <svg width="400" height="180">
        <rect width="150" height="150" style="fill: rgb(255, 0, 0); stroke-width: 5; stroke: rgb(0, 0, 0); opacity: 0.5" x="50" y="20" rx="20" ry="20" />
    </svg>

    <svg width="300" height="200">
        <polygon points="100, 10 40, 198 190," style="fill: lime; stroke: purple; stroke-width: 5; fill-rule: evenodd;"></polygon>
    </svg>

</body>
</html>
